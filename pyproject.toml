[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-roi-tracker"
version = "2.0.0"
description = "Enterprise B2B Multi-Touch Attribution & Budget Optimization Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "google-genai>=0.1.0",
    "pydantic>=2.7.0",
    "argon2-cffi>=23.1.0",
    "fpdf2>=2.7.8",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
    "loguru>=0.7.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501", "B007", "B904", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
